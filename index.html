<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Warranty Guard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <nav class="bg-white border-b border-slate-100 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold">W</div>
      <span class="font-semibold text-lg text-slate-800">Warranty Guard</span>
    </div>
    <div class="flex items-center gap-4">
      <span id="header-user-name" class="text-sm font-medium text-slate-600"></span>
      <button onclick="logout()" class="text-xs px-3 py-1.5 border border-slate-200 text-slate-500 rounded-lg hover:bg-slate-100">ออกจากระบบ</button>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs text-slate-400 font-medium">อุปกรณ์ทั้งหมด</p>
        <p id="count-total" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs text-emerald-500 font-medium">อยู่ในประกัน</p>
        <p id="count-valid" class="text-2xl font-bold text-emerald-600 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
        <p class="text-xs text-rose-500 font-medium">หมดประกันแล้ว</p>
        <p id="count-expired" class="text-2xl font-bold text-rose-600 mt-1">0</p>
      </div>
    </div>

    <div class="flex justify-between items-center">
      <h2 class="font-semibold text-slate-700">รายการอุปกรณ์ของคุณ</h2>
      <a href="add-equipment.html" class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-xl hover:bg-blue-700 transition">+ เพิ่มอุปกรณ์</a>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-50 text-slate-400 text-xs border-b border-slate-100">
          <tr>
            <th class="p-4">ชื่ออุปกรณ์</th>
            <th class="p-4">หมวดหมู่</th>
            <th class="p-4">วันหมดประกัน</th>
            <th class="p-4">สถานะ</th>
            <th class="p-4 text-center">จัดการ</th>
          </tr>
        </thead>
        <tbody id="equipment-table-body" class="divide-y divide-slate-50">
          <tr><td colspan="5" class="p-4 text-center text-slate-400">กำลังโหลดข้อมูล...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    checkAuth(true);
    setupHeaderUser();

    async function loadData() {
      try {
        const res = await fetch(`${API_BASE}/equipments`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });
        if (res.status === 401 || res.status === 403) return logout();
        const data = await res.json();

        let validCount = 0;
        let expiredCount = 0;
        const today = new Date().toISOString().split('T')[0];

        const tbody = document.getElementById('equipment-table-body');
        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-slate-400">ยังไม่มีข้อมูลอุปกรณ์ กดปุ่มเพิ่มอุปกรณ์ด้านบนได้เลย</td></tr>';
        } else {
          tbody.innerHTML = data.map(item => {
            const isExpired = item.expire_date < today;
            if (isExpired) expiredCount++; else validCount++;

            return `
              <tr class="hover:bg-slate-50/50">
                <td class="p-4 font-medium text-slate-700">${item.name} <span class="text-xs text-slate-400 block">${item.brand || ''}</span></td>
                <td class="p-4 text-slate-500">${item.category}</td>
                <td class="p-4 text-slate-600">${item.expire_date}</td>
                <td class="p-4">
                  <span class="px-2.5 py-1 text-xs rounded-full font-medium ${isExpired ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}">
                    ${isExpired ? 'หมดประกัน' : 'คุ้มครอง'}
                  </span>
                </td>
                <td class="p-4 text-center">
                  <button onclick="deleteItem(${item.id})" class="text-xs text-rose-500 hover:underline">ลบ</button>
                </td>
              </tr>
            `;
          }).join('');
        }

        document.getElementById('count-total').textContent = data.length;
        document.getElementById('count-valid').textContent = validCount;
        document.getElementById('count-expired').textContent = expiredCount;
      } catch (err) {
        console.error(err);
      }
    }

    async function deleteItem(id) {
      if (!confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) return;
      await fetch(`${API_BASE}/equipments/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': `Bearer ${getToken()}` }
      });
      loadData();
    }

    loadData();
  </script>
</body>
</html>
